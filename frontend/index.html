<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support informatique - Tickets</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Support informatique</h1>
    <p class="sous-titre">Déclarez un incident et suivez sa résolution</p>
    <span id="etat-api" class="etat">API : vérification…</span>
  </header>

  <main>
    <section class="carte">
      <h2>Nouveau ticket</h2>
      <form id="formulaire">
        <label for="titre">Titre</label>
        <input id="titre" name="titre" maxlength="120" required placeholder="Ex : imprimante du 2e étage en panne">

        <label for="description">Description</label>
        <textarea id="description" name="description" maxlength="2000" rows="4" required placeholder="Décrivez le problème"></textarea>

        <label for="priorite">Priorité</label>
        <select id="priorite" name="priorite">
          <option value="basse">Basse</option>
          <option value="normale" selected>Normale</option>
          <option value="haute">Haute</option>
        </select>

        <button type="submit">Créer le ticket</button>
        <p id="message" class="message" role="status"></p>
      </form>
    </section>

    <section class="carte">
      <div class="entete-liste">
        <h2>Tickets</h2>
        <div class="filtres">
          <input id="recherche" type="search" placeholder="Rechercher…" aria-label="Rechercher un ticket">
          <select id="filtre" aria-label="Filtrer par statut">
            <option value="">Tous les statuts</option>
            <option value="ouvert">Ouvert</option>
            <option value="en_cours">En cours</option>
            <option value="resolu">Résolu</option>
          </select>
        </div>
      </div>
      <ul id="liste" class="liste"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
